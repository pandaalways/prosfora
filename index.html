<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Προσφορές">
<link rel="apple-touch-icon" href="icon.png">
<title>Οδοντιατρική προσφορά</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, refined, aesthetic-dentistry — a well-run practice's paperwork
   IDEA: the printed treatment estimate a patient takes home
   PICTURE: the live A4 estimate itself, filling as she types
   COLOUR and TYPE: white, warm charcoal, Ardent taupe; Commissioner (full Greek)
   LAYOUT: tabs on top; form column + live document; stacks on phone */
:root{color-scheme:light dark;
--bg:light-dark(#f7f3ef,#171311);--card:light-dark(#fff,#211c19);--ink:light-dark(#2b2623,#f0e9e2);
--mut:light-dark(#7a6d64,#a8998c);--line:light-dark(#e6ddd4,#3a322c);--pri:light-dark(#4a3f38,#d8c6b5);
--pri-ink:light-dark(#fff,#171311);--acc:#9a7b63;--field:light-dark(#fff,#1b1714)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Commissioner,system-ui,sans-serif;overflow-x:clip}
header{background:var(--pri);color:var(--pri-ink);padding:18px max(4vw,16px) 0}
header h1{margin:0 0 12px;font-size:24px;line-height:1.1;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:none;background:none;border:0;color:inherit;opacity:.75;font:600 15px Commissioner,sans-serif;padding:12px 14px;border-radius:10px 10px 0 0;min-height:44px;cursor:pointer}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
main{max-width:1240px;margin:0 auto;padding:20px max(4vw,16px) 60px}
.view{display:none}.view.on{display:block}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-size:14px;color:var(--mut);margin:0 0 4px}
input,select,textarea{width:100%;font:16px Commissioner,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.f{margin-bottom:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 90px 44px;gap:8px;align-items:end}
@media(max-width:600px){.item{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.item .tr{grid-column:1/-1}.item .x{justify-self:end}}
.item .sum{grid-column:1/-1;font-size:14px;color:var(--mut);display:flex;justify-content:space-between}
.item .sum b{color:var(--ink);white-space:nowrap}
.btn{font:600 16px Commissioner,sans-serif;border-radius:10px;min-height:44px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.x{width:44px;padding:0;color:var(--mut)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;padding:6px 0}
.tot.big{font-size:22px;font-weight:700;border-top:1px solid var(--line);padding-top:10px}
.note{font-size:13px;color:var(--mut)}
.msg{font-size:14px;color:var(--acc);min-height:20px;margin-top:6px}
/* the document */
.docwrap{position:sticky;top:12px}
.doc{background:#fff;color:#2b2623;border-radius:6px;box-shadow:0 1px 2px #0002,0 12px 32px -12px #4a3f3855;padding:28px;font-size:13px;line-height:1.45}
.doc .hd{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #b2a192;padding-bottom:14px}
.doc .hd img{max-height:96px;max-width:200px;margin-bottom:6px;object-fit:contain}
.doc .clin b{display:block;font-size:17px;color:#4a3f38}
.doc .clin{color:#6b5e55}
.doc .meta{text-align:right;color:#6b5e55;white-space:nowrap}
.doc .meta b{display:block;font-size:20px;color:#9a7b63;letter-spacing:.04em}
.doc .pt{margin:16px 0;padding:10px 12px;background:#f6f1ec;border-radius:6px}
.doc table{width:100%;border-collapse:collapse}
.doc th{text-align:left;font-size:11.5px;color:#7a6d64;font-weight:600;border-bottom:1px solid #e3d9cf;padding:6px 4px}
.doc td{padding:8px 4px;border-bottom:1px solid #efe8e1;vertical-align:top}
.doc .n{text-align:right;white-space:nowrap}
.doc .sums{margin:12px 0 0 auto;width:min(260px,100%)}
.doc .sums div{display:flex;justify-content:space-between;padding:3px 0}
.doc .sums .g{font-size:17px;font-weight:700;color:#4a3f38;border-top:2px solid #4a3f38;margin-top:4px;padding-top:7px}
.doc .ft{margin-top:22px;color:#7a6d64;font-size:11.5px;border-top:1px solid #efe8e1;padding-top:10px;white-space:pre-line}
.doc .empty{color:#a89a8f;text-align:center;padding:22px 0}
.doc.a4{width:794px;min-height:1110px;border-radius:0;box-shadow:none;padding:48px 52px;font-size:13.5px}
#stage{position:absolute;left:-12000px;top:0;width:794px}
.pl{width:100%;border-collapse:collapse}
.pl td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.pl input[type=checkbox]{width:22px;min-height:22px}
@media(max-width:600px){.pl tr{display:grid;grid-template-columns:minmax(0,1fr) 100px 44px;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}.pl td{border:0;padding:0}.pl .pt2{grid-column:1/-1;font-size:14px;color:var(--mut)}.pl thead{display:none}}
.logo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo img{max-height:56px;max-width:140px;background:#fff;border-radius:6px;padding:4px}
</style>
</head>
<body>
<header>
  <h1>Οδοντιατρική προσφορά <span style="font-weight:400;opacity:.7;font-size:15px">· Ardent</span></h1>
  <nav role="tablist">
    <button role="tab" data-v="q" aria-selected="true">Προσφορά</button>
    <button role="tab" data-v="p" aria-selected="false">Τιμοκατάλογος</button>
    <button role="tab" data-v="c" aria-selected="false">Στοιχεία ιατρείου</button>
  </nav>
</header>
<main>
  <section class="view on" id="v-q">
    <div class="grid">
      <div class="card">
        <div class="row2">
          <div><label for="pName">Ασθενής</label><input id="pName" placeholder="Ονοματεπώνυμο" autocomplete="off"></div>
          <div><label for="pPhone">Τηλέφωνο</label><input id="pPhone" inputmode="tel" autocomplete="off"></div>
        </div>
        <div class="row2">
          <div><label for="qDate">Ημερομηνία</label><input id="qDate" type="date"></div>
          <div><label for="qNo">Αρ. προσφοράς</label><input id="qNo" inputmode="numeric"></div>
        </div>
        <h2>Θεραπείες</h2>
        <div id="items"></div>
        <button class="btn" id="add">+ Προσθήκη θεραπείας</button>
        <div class="row2" style="margin-top:16px">
          <div><label for="disc">Έκπτωση</label><input id="disc" inputmode="decimal" placeholder="0"></div>
          <div><label for="discT">Τύπος έκπτωσης</label><select id="discT"><option value="pct">%</option><option value="eur">€</option></select></div>
        </div>
        <div class="f"><label for="notes">Σημειώσεις για τον ασθενή</label><textarea id="notes" placeholder="π.χ. Η θεραπεία ολοκληρώνεται σε 3 συνεδρίες"></textarea></div>
        <div class="tot"><span>Υποσύνολο</span><span id="tSub"></span></div>
        <div class="tot"><span>Έκπτωση</span><span id="tDisc"></span></div>
        <div class="tot big"><span>Σύνολο</span><span id="tAll"></span></div>
        <div class="bar">
          <button class="btn pri" id="pdf">Δημιουργία PDF</button>
          <button class="btn" id="new">Νέα προσφορά</button>
        </div>
        <div class="msg" id="msg" role="status"></div>
      </div>
      <div class="docwrap"><div class="doc" id="preview"></div></div>
    </div>
  </section>

  <section class="view" id="v-p">
    <div class="card">
      <h2>Τιμοκατάλογος</h2>
      <p class="note">Ενδεικτικές τιμές, άλλαξέ τες με τις πραγματικές. «Ανά δόντι» σημαίνει ότι η τιμή πολλαπλασιάζεται με τα δόντια που γράφεις.</p>
      <table class="pl"><thead><tr><td>Θεραπεία</td><td>Τιμή €</td><td></td><td class="pt2">Ανά δόντι</td></tr></thead><tbody id="plist"></tbody></table>
      <div class="bar"><button class="btn" id="addP">+ Νέα θεραπεία</button></div>
    </div>
  </section>

  <section class="view" id="v-c">
    <div class="card">
      <h2>Στοιχεία ιατρείου</h2>
      <div class="f"><label>Λογότυπο</label><div class="logo"><img id="logoImg" alt="" hidden><input type="file" id="logoIn" accept="image/*" style="max-width:260px"><button class="btn" id="logoDel" hidden>Αφαίρεση</button></div></div>
      <div class="row2">
        <div><label for="cDoc">Όνομα ιατρού</label><input id="cDoc" data-c="doc"></div>
        <div><label for="cTitle">Τίτλος</label><input id="cTitle" data-c="title"></div>
      </div>
      <div class="f"><label for="cAddr">Διεύθυνση</label><input id="cAddr" data-c="addr"></div>
      <div class="row2">
        <div><label for="cTel">Τηλέφωνο</label><input id="cTel" data-c="tel" inputmode="tel"></div>
        <div><label for="cMail">Email</label><input id="cMail" data-c="mail" inputmode="email"></div>
      </div>
      <div class="f"><label for="cFoot">Κείμενο στο κάτω μέρος του PDF</label><textarea id="cFoot" data-c="foot"></textarea></div>
      <p class="note">Αποθηκεύονται αυτόματα σε αυτή τη συσκευή.</p>
    </div>
  </section>
</main>
<div id="stage"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

let clinic=load('clinic',{doc:'',title:'Χειρουργός Οδοντίατρος',addr:'',tel:'',mail:'',foot:'Η προσφορά ισχύει για 30 ημέρες.\nΟι τιμές περιλαμβάνουν ΦΠΑ όπου προβλέπεται.',logo:LOGO});
let q=load('quote',null)||blank();
function blank(){const n=load('nextNo',1);return{name:'',phone:'',date:today(),no:String(n),items:[{pid:prices[0]?.id,teeth:'',price:prices[0]?.price??0}],disc:'',discT:'pct',notes:''}}

const teethList=s=>String(s||'').split(/[\s,;.\/]+/).filter(Boolean);
const priceOf=id=>prices.find(p=>p.id==id);
function lineOf(it){const p=priceOf(it.pid);const t=teethList(it.teeth);const per=p?p.per:false;const qty=per?Math.max(t.length,1):1;const unit=parseFloat(String(it.price).replace(',','.'))||0;return{p,t,qty,unit,total:qty*unit,per}}
function totals(){const sub=q.items.reduce((a,it)=>a+lineOf(it).total,0);const d=parseFloat(String(q.disc).replace(',','.'))||0;const disc=Math.min(sub,q.discT==='pct'?sub*d/100:d);return{sub,disc,all:sub-disc}}

function renderItems(){
 $('items').innerHTML=q.items.map((it,i)=>{const L=lineOf(it);return `<div class="item" data-i="${i}">
  <div class="tr"><label>Θεραπεία</label><select data-k="pid">${prices.map(p=>`<option value="${p.id}"${p.id==it.pid?' selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
  <div><label>Δόντια</label><input data-k="teeth" value="${esc(it.teeth)}" placeholder="π.χ. 21, 22, 24" inputmode="numeric" autocomplete="off"></div>
  <div><label>Τιμή €</label><input data-k="price" value="${esc(it.price)}" inputmode="decimal"></div>
  <button class="btn x" data-del="${i}" aria-label="Διαγραφή">✕</button>
  <div class="sum"><span>${L.per?`${L.qty} × ${eur(L.unit)}`:'Σταθερή τιμή'}</span><b>${eur(L.total)}</b></div></div>`}).join('')||'<p class="note">Δεν υπάρχουν θεραπείες ακόμη.</p>';
}
function updSums(){
 document.querySelectorAll('.item').forEach(el=>{const L=lineOf(q.items[el.dataset.i]);el.querySelector('.sum').innerHTML=`<span>${L.per?`${L.qty} × ${eur(L.unit)}`:'Σταθερή τιμή'}</span><b>${eur(L.total)}</b>`});
 const T=totals();$('tSub').textContent=eur(T.sub);$('tDisc').textContent=T.disc?'− '+eur(T.disc):'—';$('tAll').textContent=eur(T.all);
 $('preview').innerHTML=docHTML();save('quote',q);
}
function docHTML(){
 const T=totals();const c=clinic;const d=q.date?new Date(q.date+'T12:00').toLocaleDateString('el-GR'):'';
 const rows=q.items.map(it=>{const L=lineOf(it);if(!L.p)return'';return `<tr><td>${esc(L.p.name)}</td><td>${esc(L.t.join(', '))||'—'}</td><td class="n">${L.per?L.qty:'—'}</td><td class="n">${eur(L.unit)}</td><td class="n">${eur(L.total)}</td></tr>`}).join('');
 const contact=[c.addr,c.tel&&('Τηλ. '+c.tel),c.mail].filter(Boolean).map(esc).join('<br>');
 return `<div class="hd"><div class="clin">${c.logo?`<img src="${esc(c.logo)}" alt=""><br>`:''}<b>${esc(c.doc)||'Όνομα ιατρού'}</b>${esc(c.title)}${contact?'<br>'+contact:''}</div>
  <div class="meta"><b>ΠΡΟΣΦΟΡΑ</b>Αρ. ${esc(q.no)}<br>${esc(d)}</div></div>
  <div class="pt"><b>Ασθενής:</b> ${esc(q.name)||'—'}${q.phone?` &nbsp;·&nbsp; Τηλ. ${esc(q.phone)}`:''}</div>
  ${rows?`<table><thead><tr><th>Θεραπεία</th><th>Δόντια</th><th class="n">Τεμ.</th><th class="n">Τιμή</th><th class="n">Ποσό</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Πρόσθεσε θεραπείες</div>'}
  <div class="sums">${T.disc?`<div><span>Υποσύνολο</span><span>${eur(T.sub)}</span></div><div><span>Έκπτωση${q.discT==='pct'?' '+esc(q.disc)+'%':''}</span><span>− ${eur(T.disc)}</span></div>`:''}<div class="g"><span>Σύνολο</span><span>${eur(T.all)}</span></div></div>
  ${q.notes?`<p style="margin-top:16px;white-space:pre-line">${esc(q.notes)}</p>`:''}
  ${c.foot?`<div class="ft">${esc(c.foot)}</div>`:''}`;
}
function fillQ(){$('pName').value=q.name;$('pPhone').value=q.phone;$('qDate').value=q.date;$('qNo').value=q.no;$('disc').value=q.disc;$('discT').value=q.discT;$('notes').value=q.notes;renderItems();updSums()}

// quote events
[['pName','name'],['pPhone','phone'],['qDate','date'],['qNo','no'],['disc','disc'],['discT','discT'],['notes','notes']].forEach(([id,k])=>$(id).addEventListener('input',e=>{q[k]=e.target.value;updSums()}));
$('items').addEventListener('input',e=>{const el=e.target.closest('.item');if(!el)return;const it=q.items[el.dataset.i];const k=e.target.dataset.k;it[k]=e.target.value;
 if(k==='pid'){const p=priceOf(it.pid);it.pid=p?.id;it.price=p?.price??0;el.querySelector('[data-k=price]').value=it.price}updSums()});
$('items').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;q.items.splice(+b.dataset.del,1);renderItems();updSums()});
$('add').onclick=()=>{q.items.push({pid:prices[0]?.id,teeth:'',price:prices[0]?.price??0});renderItems();updSums();const s=document.querySelectorAll('.item select');s[s.length-1]?.focus()};
let armed=false;
$('new').onclick=()=>{if(!armed){armed=true;$('new').textContent='Σίγουρα; Πάτα ξανά';setTimeout(()=>{armed=false;$('new').textContent='Νέα προσφορά'},3000);return}
 armed=false;$('new').textContent='Νέα προσφορά';q=blank();fillQ();$('msg').textContent=''};

// PDF
let dl=null;
(async()=>{try{if(window.claude?.use)dl=await window.claude.use('downloads')}catch(e){}})();
$('pdf').onclick=async()=>{
 const msg=$('msg');if(!window.html2pdf){msg.textContent='Δεν φόρτωσε το εργαλείο PDF. Δοκίμασε ξανά σε λίγο.';return}
 msg.textContent='Ετοιμάζεται το PDF…';
 const sy=window.scrollY;window.scrollTo(0,0);const st=$('stage');st.innerHTML=`<div class="doc a4">${docHTML()}</div>`;
 const fname=`Προσφορά ${q.no} ${(q.name||'ασθενής').replace(/[\\/:*?"<>|]/g,'')}.pdf`;
 try{
  const blob=await html2pdf().set({margin:0,image:{type:'jpeg',quality:.96},html2canvas:{scale:2,backgroundColor:'#ffffff',scrollX:0,scrollY:0,windowWidth:794},jsPDF:{unit:'px',format:[794,1123],hotfixes:['px_scaling']},pagebreak:{mode:['css','legacy'],avoid:'tr'}}).from(st.firstElementChild).outputPdf('blob');
  st.innerHTML='';window.scrollTo(0,sy);
  if(dl){await dl.save({filename:fname,data:blob})}
  else{const f=new File([blob],fname,{type:'application/pdf'});
   if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:fname});
   else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove()}}
  msg.textContent='Έτοιμο ✓';
  const n=parseInt(q.no,10);if(n>=load('nextNo',1))save('nextNo',n+1);
 }catch(e){st.innerHTML='';window.scrollTo(0,sy);msg.textContent=e&&e.code==='declined'?'Ακυρώθηκε.':'Δεν ολοκληρώθηκε η αποθήκευση. Δοκίμασε ξανά.'}
};

// price list
function renderP(){$('plist').innerHTML=prices.map((p,i)=>`<tr data-i="${i}"><td><input data-k="name" value="${esc(p.name)}" aria-label="Θεραπεία"></td><td><input data-k="price" value="${esc(p.price)}" inputmode="decimal" aria-label="Τιμή"></td><td><button class="btn x" data-del="${i}" aria-label="Διαγραφή">✕</button></td><td class="pt2"><label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" data-k="per"${p.per?' checked':''}> Ανά δόντι</label></td></tr>`).join('')}
$('plist').addEventListener('input',e=>{const tr=e.target.closest('tr');const p=prices[tr.dataset.i];const k=e.target.dataset.k;
 p[k]=k==='per'?e.target.checked:k==='price'?(parseFloat(e.target.value.replace(',','.'))||0):e.target.value;save('prices',prices)});
$('plist').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;prices.splice(+b.dataset.del,1);save('prices',prices);renderP()});
$('addP').onclick=()=>{prices.push({id:Date.now(),name:'',price:0,per:true});save('prices',prices);renderP();const r=$('plist').lastElementChild;r?.querySelector('input')?.focus()};

// clinic
document.querySelectorAll('[data-c]').forEach(el=>{el.value=clinic[el.dataset.c]||'';el.addEventListener('input',()=>{clinic[el.dataset.c]=el.value;save('clinic',clinic)})});
function showLogo(){$('logoImg').hidden=!clinic.logo;$('logoDel').hidden=!clinic.logo;if(clinic.logo)$('logoImg').src=clinic.logo}
$('logoIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const s=Math.min(1,400/img.width,200/img.height);const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);clinic.logo=c.toDataURL('image/png');save('clinic',clinic);showLogo();URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)});
$('logoDel').onclick=()=>{clinic.logo='';save('clinic',clinic);showLogo();$('logoIn').value=''};

// tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));if(b.dataset.v==='q'){renderItems();updSums()}});

renderP();showLogo();fillQ();
}
</script>
</body>
</html>
